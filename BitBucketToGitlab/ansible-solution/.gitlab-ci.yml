---
stages: [validate]

lint:
  stage: validate
  image: python:3.11
  script:
    - pip install ansible-lint yamllint "ansible-core>=2.15"
    - ansible-galaxy collection install -r requirements.yml
    - yamllint .
    - ansible-lint

syntax:
  stage: validate
  image: python:3.11
  script:
    - pip install "ansible-core>=2.15"
    - ansible-galaxy collection install -r requirements.yml
    - ansible-playbook playbooks/site.yml --syntax-check
