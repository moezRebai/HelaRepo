---
# Valeurs injectées à l'exécution — jamais en clair ici.
# awx_ssh_user / awx_ssh_key doivent être fournies via vault chiffré ou variables
# d'environnement au moment du `apply.yml` (voir README.md, section Prérequis).
awx_credentials:
  - name: dev-machine
    organization: Default
    credential_type: Machine
    inputs:
      username: "{{ awx_ssh_user }}"
      ssh_key_data: "{{ awx_ssh_key }}"
