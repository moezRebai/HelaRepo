---
# Job Template = remplacement du job Jenkins "webserver-provision" (freestyle/pipeline).
awx_job_templates:
  - name: webserver-provision
    project: ansible-solution
    playbook: playbooks/site.yml
    inventory: dev
    credentials: [dev-machine]
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Paramètres de provisioning"
      spec:
        - question_name: "Port applicatif"
          variable: app_port
          type: integer
          default: 8080
          required: true
